<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin Win</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg1:#123a24; --bg2:#0d2e1c; --bg3:#081c12;
    --gold:#e8c15c; --gold-dim:#8a6d1f;
    --red:#a2170f; --red2:#7c0f09;
    --black:#141414; --black2:#0a0a0a;
    --green:#1e8a54; --blue:#3a63e0;
    --text:#f4ede0; --text-dim:#b7ab8f;
    --felt:#0d4a2c; --felt2:#0a3a22;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
  body{
    background:
      radial-gradient(circle at 20% 0%, #1f5c38 0%, transparent 55%),
      radial-gradient(circle at 100% 100%, #0d2e1c 0%, transparent 50%),
      linear-gradient(180deg, var(--bg1), var(--bg3));
    color:var(--text); min-height:100vh; overflow-x:hidden;
  }
  .wrap{padding:14px 6px 12px; max-width:600px; margin:0 auto;}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 2px 14px;}
  .topbar-left{display:flex; align-items:center; gap:10px;}
  .logo{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd76b,#e0501f);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#2b1140;font-size:18px;
    box-shadow:0 0 0 2px var(--gold), 0 4px 10px rgba(0,0,0,.4);}
  .brand{font-size:20px;font-weight:800;letter-spacing:.6px; font-family:Georgia,'Times New Roman',serif;}
  .brand span{color:var(--gold);}

  .player-count{display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.06);
    border:1px solid var(--gold-dim); border-radius:20px; padding:6px 12px;}
  .player-count .pc-dot{width:7px; height:7px; border-radius:50%; background:#18b673;
    box-shadow:0 0 6px #18b673; animation:pcPulse 1.4s infinite;}
  .player-count .pc-num{font-size:12.5px; font-weight:800; color:var(--gold); white-space:nowrap;}
  .player-count .pc-label{font-size:9px; color:var(--text-dim); font-weight:700;}
  @keyframes pcPulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

  .wallet-row{display:flex; gap:8px; margin-bottom:16px;}
  .wallet-chip{flex:1; background:linear-gradient(160deg,#173d27,#0d2416); border:1px solid var(--gold-dim);
    border-radius:14px; padding:10px 8px; text-align:center;}
  .wallet-chip .label{font-size:11px; color:var(--text-dim); margin-bottom:2px;}
  .wallet-chip .value{font-size:18px; font-weight:800; color:var(--gold);}

  #wheel-wrapper{position:relative; width:280px; height:280px; margin:18px auto 0;
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));}
  #wheel-bezel{position:absolute; inset:-10px; border-radius:50%;
    background:conic-gradient(from 0deg, #fff8dc, #c99b1f, #fff8dc, #8a6d1f, #fff8dc, #c99b1f, #fff8dc);
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.35), 0 0 0 2px rgba(0,0,0,.4);}
  #wheel-bezel::after{content:''; position:absolute; inset:9px; border-radius:50%;
    background:radial-gradient(circle at 35% 25%, #2a2a2a, #0a0a0a 70%);}
  #top-arc{position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:150px; height:26px;
    overflow:hidden; z-index:6; pointer-events:none;}
  #top-arc svg{width:150px; height:52px; display:block;}
  #pointer{position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:0; height:0;
    border-left:11px solid transparent; border-right:11px solid transparent; border-top:20px solid var(--gold); z-index:7;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));}
  #wheel-container{width:280px; height:280px; border-radius:50%; position:relative;
    transition:transform 9.6s cubic-bezier(0.10,0.68,0.08,1); overflow:hidden;
    box-shadow:inset 0 0 22px rgba(0,0,0,.65), inset 0 0 0 2px rgba(0,0,0,.5);}
  #wheel-container svg{width:100%; height:100%; display:block;}
  #hub{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:82px; height:82px;
    background:radial-gradient(circle at 35% 28%,#5a6fd8,#2438a8 55%,#141d5e); border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:4;
    box-shadow:0 0 0 4px #d9c98a, 0 0 0 6px rgba(0,0,0,.5), inset 0 3px 8px rgba(255,255,255,.25), inset 0 -6px 10px rgba(0,0,0,.5);}
  #hub .htxt{font-weight:900; color:#fff; font-size:12px; letter-spacing:.5px; line-height:1.25; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,.6);}

  .winner-ticker{width:100%; min-height:48px; margin-bottom:8px; padding:8px 12px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(160deg,#173d27,#0d2416); border:1px solid var(--gold-dim);
    border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,.4); overflow:hidden;}
  .winner-ticker .ticker-main{display:block; color:var(--gold); font-size:14px; font-weight:900;
    line-height:1.2; white-space:nowrap; animation:tickerFade .45s ease;}
  .winner-ticker .ticker-demo{display:block; color:var(--text-dim); font-size:8px; font-weight:700; margin-top:2px;}
  @keyframes tickerFade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  .history-corner{width:100%; margin-bottom:8px;
    background:linear-gradient(160deg,#173d27,#0d2416); border:1px solid var(--gold-dim); border-radius:10px;
    padding:6px 8px; box-shadow:0 4px 10px rgba(0,0,0,.4);}
  .hc-title{font-size:10px; color:var(--text-dim); font-weight:700; margin-bottom:5px;}
  .history-strip{display:grid; grid-template-rows:repeat(2,1fr); grid-auto-flow:column; gap:5px; overflow-x:auto; padding-bottom:2px;}
  .hist-chip{flex:0 0 auto; min-width:22px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:900; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.25);}
  .hist-chip.red{background:linear-gradient(160deg,var(--red),var(--red2));}
  .hist-chip.black{background:linear-gradient(160deg,#2a2a2a,#111);}
  .hist-chip.green{background:linear-gradient(160deg,#1fae74,#128c5c);}
  .hist-empty{font-size:11px; color:var(--text-dim); white-space:nowrap;}

  .timer-badge{position:absolute; top:-4px; right:-4px; z-index:9; width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 28%, #1f5c38, #0d2416); border:2px solid var(--gold);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.5);}
  .timer-badge .tb-count{font-size:17px; font-weight:900; color:var(--gold); line-height:1;}
  .timer-badge .tb-label{font-size:7px; color:var(--text-dim); font-weight:700; margin-top:1px;}
  .timer-badge.spinning{border-color:#18b673;}
  .timer-badge.spinning .tb-count{color:#18b673;}

  .result-line{min-height:26px; text-align:center; font-weight:800; font-size:15px; margin-bottom:6px;}
  .result-line.win{color:var(--gold);}
  .result-line.lose{color:var(--text-dim);}

  /* ---- Betting table (felt) ---- */
  .stake-box{background:linear-gradient(160deg,rgba(245,197,66,.10),rgba(245,197,66,.02));
    border:1px solid var(--gold-dim); border-radius:14px; padding:8px 4px; margin-bottom:10px;}
  .stake-box .title{display:flex; align-items:center; gap:6px; color:var(--gold); font-weight:700; margin-bottom:8px; font-size:13px; padding:0 4px;}

  .table-felt{background:radial-gradient(ellipse at 50% 0%, var(--felt), var(--felt2) 80%);
    border:2px solid var(--gold-dim); border-radius:12px; padding:8px 3px; box-shadow:inset 0 0 14px rgba(0,0,0,.5);}

  .zero-row{background:linear-gradient(180deg,#1fae74,#128c5c); color:#fff; text-align:center;
    font-weight:900; font-size:16px; padding:8px 0; border-radius:6px; margin-bottom:4px; cursor:pointer;
    border:1px solid rgba(255,255,255,.15); transition:.15s;}
  .zero-row.selected{outline:2px solid var(--gold); box-shadow:0 0 8px var(--gold); transform:scale(1.02);}

  .num-grid{display:grid; grid-template-columns:repeat(12,1fr); grid-template-rows:repeat(3,1fr); grid-auto-flow:column; gap:3px; width:100%;}
  .num-cell{aspect-ratio:1/1.55; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:900; color:#fff; cursor:pointer; border-radius:5px;
    border:1px solid rgba(0,0,0,.35); transition:.12s; user-select:none; text-shadow:0 1px 2px rgba(0,0,0,.5);}
  .num-cell.red{background:linear-gradient(160deg,var(--red),var(--red2));}
  .num-cell.black{background:linear-gradient(160deg,#2a2a2a,#111);}
  .num-cell.marked{outline:3px solid var(--gold); box-shadow:0 0 10px var(--gold); transform:scale(1.14); z-index:2; position:relative;
    background:linear-gradient(160deg,#ffd76b,#e0a92f) !important; color:#2b1140 !important; text-shadow:none;}
  .num-cell.disabled{pointer-events:none; opacity:.55;}
  .zero-row.disabled{pointer-events:none; opacity:.55;}
  .outside-cell.disabled{pointer-events:none; opacity:.55;}

  .dozens-row, .outside-row, .columns-row{display:flex; gap:3px; margin-top:6px;}
  .outside-cell{flex:1; text-align:center; color:#fff; font-weight:700; font-size:12.5px;
    padding:11px 2px; border-radius:6px; cursor:pointer; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15); transition:.12s; line-height:1.3;}
  .outside-cell small{display:block; font-size:10px; opacity:.75; font-weight:600;}
  .outside-cell.red-cell{background:linear-gradient(160deg,var(--red),var(--red2));}
  .outside-cell.black-cell{background:linear-gradient(160deg,#2a2a2a,#111);}
  .outside-cell.selected{outline:2px solid var(--gold); box-shadow:0 0 8px var(--gold); background:rgba(245,197,66,.18);}

  .selected-line{text-align:center; margin-top:10px; font-size:12.5px; color:var(--text-dim);}
  .selected-line b{color:var(--gold);}

  .spin-cost{text-align:center; color:var(--text-dim); font-size:12px; margin-top:4px;}
  .spin-cost b{color:var(--gold);}

  .stake-picker{display:block; margin-bottom:7px; padding:0 2px;}
  .stake-picker .sp-label{display:block; font-size:11px; color:var(--text-dim); font-weight:700; margin-bottom:6px; white-space:nowrap;}
  .stake-chips{display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:3px; width:100%;}
  .stake-chip{min-width:0; width:100%; text-align:center; padding:7px 1px; border-radius:7px; font-weight:800; font-size:11px;
    color:var(--text); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); cursor:pointer; transition:.12s; user-select:none;}
  .stake-chip:active{transform:scale(.96);}
  .stake-chip.active{background:linear-gradient(90deg,var(--gold),#e0a92f); color:#2b1140; border-color:var(--gold);
    box-shadow:0 0 8px rgba(245,197,66,.5);}

  .confirm-btn{width:100%; border:none; border-radius:10px; padding:14px; margin-top:8px;
    font-family:Georgia,'Times New Roman',serif; letter-spacing:.4px;
    font-size:17px; font-weight:800; color:#2b1140; background:linear-gradient(90deg,var(--gold),#e0a92f);
    box-shadow:0 6px 16px rgba(245,197,66,.35); cursor:pointer;}
  .confirm-btn:disabled{opacity:.4; cursor:default;}
  .confirm-btn.ticketed{background:linear-gradient(90deg,#18b673,#0f8f5a); color:#fff;}

  .marked-count{text-align:center; font-size:12px; color:var(--text-dim); margin-top:6px;}
  .marked-count b{color:var(--gold);}

  .msg{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:#0d2416; border:1px solid var(--gold);
    color:var(--text); padding:10px 18px; border-radius:12px; font-size:13px; font-weight:700; z-index:50; display:none;
    box-shadow:0 6px 16px rgba(0,0,0,.4); max-width:88%; text-align:center;}

  /* ---- Win flash overlay ---- */
  .win-flash{position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); z-index:60;}
  .win-flash.show{display:flex; animation:winFadeOut 2.4s forwards;}
  .win-flash-inner{background:linear-gradient(160deg,#ffe08a,#e0a92f); color:#2b1140;
    padding:26px 34px; border-radius:20px; font-size:22px; font-weight:900; text-align:center; max-width:80%;
    box-shadow:0 0 40px rgba(245,197,66,.8), 0 10px 30px rgba(0,0,0,.5);
    animation:winPop .5s cubic-bezier(.3,1.6,.5,1);}
  @keyframes winPop{0%{transform:scale(0.3); opacity:0;} 60%{transform:scale(1.1);} 100%{transform:scale(1); opacity:1;}}
  @keyframes winFadeOut{0%{opacity:1;} 75%{opacity:1;} 100%{opacity:0; display:none;}}

  @media(max-width:360px){
    .stake-chips{gap:2px;}
    .stake-chip{font-size:9.5px; padding:7px 0;}
    .num-cell{font-size:13px;}
  }
</style>
</head>
<body>

<div class="msg" id="msg"></div>
<div class="win-flash" id="winFlash"><div class="win-flash-inner" id="winFlashInner"></div></div>

<div class="wrap">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">S</div>
      <div class="brand">Spin <span>Win</span></div>
    </div>
    <div class="player-count">
      <span class="pc-dot"></span>
      <div>
        <div class="pc-num" id="playerCountNum">10,000+</div>
        <div class="pc-label">ተጫዋቾች</div>
      </div>
    </div>
  </div>

  <div class="winner-ticker">
    <div>
      <span class="ticker-main" id="tickerText">🎉 DEMO — የማሳያ ውጤት</span>
      <span class="ticker-demo">DEMO / SIMULATED</span>
    </div>
  </div>

  <div class="history-corner">
    <div class="hc-title">ውጤቶች</div>
    <div class="history-strip" id="historyStrip"></div>
  </div>

  <div class="wallet-row">
    <div class="wallet-chip"><div class="label">ሂሳብ</div><div class="value" id="walletBalance">–</div></div>
    <div class="wallet-chip"><div class="label">ውርርድ ዋጋ</div><div class="value" id="walletStake">10</div></div>
  </div>

  <div id="wheel-wrapper">
    <div id="wheel-bezel"></div>
    <div id="top-arc">
      <svg viewBox="0 0 150 52"><path d="M15,50 A60,60 0 0 1 135,50" fill="none" stroke="#3a63e0" stroke-width="4" stroke-linecap="round"/></svg>
    </div>
    <div id="pointer"></div>
    <div id="wheel-container">
      <svg id="wheel-svg" viewBox="0 0 300 300"></svg>
    </div>
    <div id="hub"><div class="htxt">SPIN<br>WIN</div></div>

    <div class="timer-badge" id="timerBadge">
      <div class="tb-count" id="rtCount">40</div>
      <div class="tb-label" id="rtLabel">ይምረጡ</div>
    </div>
  </div>
  <div class="result-line" id="resultLine"></div>

  <div class="stake-box">
    <div class="title">▷ በሠንጠረዡ ላይ ቁጥር ወይም ምርጫ በጣትዎ ይንኩ</div>
    <div class="stake-picker">
      <div class="sp-label">ውርርድ መጠን፦</div>
      <div class="stake-chips" id="stakeChips"></div>
    </div>
    <div class="table-felt">
      <div class="zero-row" data-bet="number" data-value="0">0</div>
      <div class="num-grid" id="numGrid"></div>
      <div class="dozens-row">
        <div class="outside-cell" data-bet="dozen1">1ኛ ደርዘን<br><small>1–12 · 3x</small></div>
        <div class="outside-cell" data-bet="dozen2">2ኛ ደርዘን<br><small>13–24 · 3x</small></div>
        <div class="outside-cell" data-bet="dozen3">3ኛ ደርዘን<br><small>25–36 · 3x</small></div>
      </div>
      <div class="outside-row">
        <div class="outside-cell" data-bet="low">1–18</div>
        <div class="outside-cell" data-bet="even">ጥምዝ</div>
        <div class="outside-cell red-cell" data-bet="red">ቀይ</div>
        <div class="outside-cell black-cell" data-bet="black">ጥቁር</div>
        <div class="outside-cell" data-bet="odd">ጎዶሎ</div>
        <div class="outside-cell" data-bet="high">19–36</div>
      </div>
    </div>
    <div class="selected-line">የተመረጠው ውርርድ፦ <b id="selectedLabel">— ገና አልተመረጠም —</b></div>
    <div class="marked-count" id="markedCount"></div>
    <div class="spin-cost">እያንዳንዱ ቁጥር <b id="spinCostLabel">10</b> ብር ያስከፍላል</div>
  </div>

  <button class="confirm-btn" id="ticketBtn" onclick="cutTicket()">🎫 ትኬት ቁረጥ</button>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
const initData = (tg && tg.initData) ? tg.initData : '';

function toast(t){
  const m=document.getElementById('msg'); m.textContent=t; m.style.display='block';
  clearTimeout(window._mt); window._mt=setTimeout(()=>m.style.display='none',2600);
}

function showWinFlash(amount){
  const el = document.getElementById('winFlash');
  document.getElementById('winFlashInner').textContent = '🎉 እንኳን ደስ አለዎት! ' + amount + ' ብር አሸንፈዋል 🎉';
  el.classList.remove('show'); void el.offsetWidth;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2400);
}

/* ---------- state ---------- */
let betType = null;
let markedNumbers = [];
let balance = 0;
let spinning = false;
let ticketPlaced = false;
let ticketId = null;

/*
  FIX: stake options now match the server's STAKE_OPTIONS exactly
  (5,10,20,30,40,50,80,100,200) — previously 80/100/200 were missing here
  so users could never select or bet them even though the server allowed it.
*/
const STAKE_OPTIONS = [5,10,20,30,40,50,80,100,200];
const STAKE_MIN = 5, STAKE_MAX = 200;
let currentStake = 10;
const MAX_NUMBERS = 8;
const BET_LENGTH = 40;
const SPIN_LENGTH = 10;
const RESULT_DISPLAY_MS = 4000;
const CYCLE_LENGTH = BET_LENGTH + SPIN_LENGTH;
let timeOffset = 0;
async function syncTime(){
  try{
    const t0 = Date.now();
    const r = await fetch('/', {method:'HEAD', cache:'no-store'});
    const d = r.headers.get('date');
    if (d) timeOffset = new Date(d).getTime() + 500 - (t0 + Date.now())/2;
  }catch(e){}
}
syncTime();
setInterval(syncTime, 300000);
const HISTORY_MAX = 10;
let resultHistory = [];

/* ---------- wallet ---------- */
async function refreshBalance(){
  try{
    const resp = await fetch(`/api/balance?initData=${encodeURIComponent(initData)}`);
    const data = await resp.json();
    balance = data.balance ?? 0;
    document.getElementById('walletBalance').textContent = balance;
  }catch(e){
    document.getElementById('walletBalance').textContent = '–';
  }
}
refreshBalance();

async function restoreLastResult(){
  try{
    const resp = await fetch(`/api/round-history?initData=${encodeURIComponent(initData)}`);
    if (!resp.ok) return;
    const data = await resp.json();

    if (Array.isArray(data.history) && data.history.length){
      resultHistory = data.history.slice(0, HISTORY_MAX);
      renderHistory();
    }

    if (typeof data.last_winning_number === 'number'){
      const winningIndex = WHEEL_ORDER.indexOf(data.last_winning_number);
      if (winningIndex >= 0){
        const targetAngle = winningIndex * segAngle + segAngle/2;
        const wheel = document.getElementById('wheel-container');
        wheel.style.transition = 'none';
        currentRotation = -targetAngle;
        wheel.style.transform = `rotate(${currentRotation}deg)`;
        void wheel.offsetWidth;
        wheel.style.transition = '';
      }
    }
  }catch(e){}
}
restoreLastResult();

document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState === 'visible'){
    refreshBalance();
    restoreLastResult();
  }
});

/* ---------- stake picker ---------- */
const stakeChipsEl = document.getElementById('stakeChips');
function renderStakeChips(){
  stakeChipsEl.innerHTML = '';
  STAKE_OPTIONS.forEach(v=>{
    const chip = document.createElement('div');
    chip.className = 'stake-chip' + (v === currentStake ? ' active' : '');
    chip.textContent = v;
    chip.addEventListener('click', ()=>{
      if (ticketPlaced || spinning) return;
      currentStake = v;
      document.getElementById('walletStake').textContent = currentStake;
      document.getElementById('spinCostLabel').textContent = currentStake;
      renderStakeChips();
      refreshSelectedLine();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    });
    stakeChipsEl.appendChild(chip);
  });
}
renderStakeChips();
document.getElementById('walletStake').textContent = currentStake;
document.getElementById('spinCostLabel').textContent = currentStake;

/* ---------- DEMO / SIMULATED live player counter ----------
   Shows a number of players that varies slightly each round (10,000+ base).
   This is a display-only demo counter, not a real connection count. */
let currentPlayerCount = 10247;
function randomizePlayerCount(){
  const delta = Math.floor(Math.random() * 240) - 100; // -100..+139
  currentPlayerCount = Math.max(10000, currentPlayerCount + delta);
  const el = document.getElementById('playerCountNum');
  if (el) el.textContent = currentPlayerCount.toLocaleString('en-US');
}
randomizePlayerCount();
let lastPlayerCountRound = null;
function updatePlayerCount(){
  const cid = roundIdNowSafe();
  if (lastPlayerCountRound === null){ lastPlayerCountRound = cid; return; }
  if (cid !== lastPlayerCountRound){ lastPlayerCountRound = cid; randomizePlayerCount(); }
}

/* ---------- DEMO / SIMULATED winner ticker ----------
   These are clearly labeled DEMO / SIMULATED — not real players or real winners.
   A brand new random phone number + amount is generated every time it fires
   (no fixed list, so it never repeats the same value twice in a row).

   UPDATED: each betting round now shows a fixed burst of 2–5 winners
   (randomized per round), each one blinking in exactly 1.8 seconds apart.
   The burst restarts every time a new betting round begins. */
const TICKER_AMOUNTS = [180, 240, 300, 360, 420, 480, 600, 720, 840, 900, 1080, 1200, 1440, 1500, 1800, 2160];
const TICKER_BLINK_MS = 1800;      // fixed 1.8s gap between each blink
const TICKER_MIN_PER_ROUND = 2;
const TICKER_MAX_PER_ROUND = 5;
let lastTickerPhone = null;
function randomDemoPhone(){
  let phone;
  do{
    const digits = String(Math.floor(1000 + Math.random() * 9000));
    phone = '2519****' + digits;
  } while (phone === lastTickerPhone);
  lastTickerPhone = phone;
  return phone;
}
function randomDemoAmount(){
  return TICKER_AMOUNTS[Math.floor(Math.random() * TICKER_AMOUNTS.length)];
}
function showDemoWinner(){
  const ticker = document.getElementById('tickerText');
  if (!ticker) return;
  const phone = randomDemoPhone();
  const amount = randomDemoAmount();
  ticker.textContent = `${phone}   🎉 ${amount} birr`;
  ticker.style.animation = 'none';
  void ticker.offsetWidth;
  ticker.style.animation = 'tickerFade .45s ease';
}

/* Fires a random count (2–5) of winner blinks for the current round,
   each one exactly TICKER_BLINK_MS apart. */
let winnerBurstTimers = [];
function clearWinnerBurst(){
  winnerBurstTimers.forEach(t=>clearTimeout(t));
  winnerBurstTimers = [];
}
function startWinnerBurstForRound(){
  clearWinnerBurst();
  const span = TICKER_MAX_PER_ROUND - TICKER_MIN_PER_ROUND + 1;
  const count = TICKER_MIN_PER_ROUND + Math.floor(Math.random() * span); // 2..5
  for (let i = 0; i < count; i++){
    const t = setTimeout(showDemoWinner, i * TICKER_BLINK_MS);
    winnerBurstTimers.push(t);
  }
}
showDemoWinner();
startWinnerBurstForRound();

function roundIdNowSafe(){ return Math.floor((Date.now()+timeOffset)/1000 / CYCLE_LENGTH); }

/* ---------- roulette colours ---------- */
const RED_NUMBERS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
function colorFor(n){ if(n===0) return 'green'; return RED_NUMBERS.has(n) ? 'red' : 'black'; }

/* ---------- number grid ---------- */
const numGrid = document.getElementById('numGrid');
for (let n=1; n<=36; n++){
  const cell = document.createElement('div');
  cell.className = 'num-cell ' + colorFor(n);
  cell.textContent = n;
  cell.dataset.bet = 'number';
  cell.dataset.value = n;
  numGrid.appendChild(cell);
}

const BET_LABELS = {
  red:'ቀይ Red', black:'ጥቁር Black', odd:'ጎዶሎ Odd', even:'ጥምዝ Even',
  low:'1–18', high:'19–36',
  dozen1:'1ኛ ደርዘን (1–12)', dozen2:'2ኛ ደርዘን (13–24)', dozen3:'3ኛ ደርዘን (25–36)',
};

const numberEls = document.querySelectorAll('[data-bet="number"]');
const outsideEls = document.querySelectorAll('.outside-cell[data-bet]');
const zeroRow = document.querySelector('.zero-row[data-bet="number"]');

function refreshSelectedLine(){
  const label = document.getElementById('selectedLabel');
  const count = document.getElementById('markedCount');
  if (betType === 'number' && markedNumbers.length){
    const sorted = [...markedNumbers].sort((a,b)=>a-b);
    label.textContent = 'ቁጥር ' + sorted.join(', ') + ' (36x)';
    count.textContent = 'የተመረጡ ቁጥሮች: ' + markedNumbers.length + '/' + MAX_NUMBERS;
  } else if (betType){
    label.textContent = BET_LABELS[betType] || betType;
    count.textContent = '';
  } else {
    label.textContent = '— ገና አልተመረጠም —';
    count.textContent = '';
  }
  document.getElementById('ticketBtn').disabled = ticketPlaced || spinning ||
    !(betType === 'number' ? markedNumbers.length > 0 : !!betType);
}

numberEls.forEach(el=>{
  el.addEventListener('click', ()=>{
    if (ticketPlaced || spinning) return;
    const n = parseInt(el.dataset.value, 10);
    const idx = markedNumbers.indexOf(n);
    if (idx >= 0){
      markedNumbers.splice(idx,1);
      el.classList.remove('marked');
    } else {
      if (markedNumbers.length >= MAX_NUMBERS){
        toast('⚠️ በአንድ ትኬት ቢበዛ ' + MAX_NUMBERS + ' ቁጥር ብቻ መያዝ ይችላሉ');
        return;
      }
      markedNumbers.push(n);
      el.classList.add('marked');
    }
    if (markedNumbers.length > 0){
      betType = 'number';
      outsideEls.forEach(e=>e.classList.remove('selected'));
      zeroRow.classList.remove('selected');
    } else {
      betType = null;
    }
    refreshSelectedLine();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  });
});

zeroRow.addEventListener('click', ()=>{
  if (ticketPlaced || spinning) return;
  outsideEls.forEach(e=>e.classList.remove('selected'));
  numberEls.forEach(e=>e.classList.remove('marked'));
  markedNumbers = [0];
  betType = 'number';
  zeroRow.classList.add('selected');
  refreshSelectedLine();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
});

outsideEls.forEach(el=>{
  el.addEventListener('click', ()=>{
    if (ticketPlaced || spinning) return;
    outsideEls.forEach(e=>e.classList.remove('selected'));
    el.classList.add('selected');
    zeroRow.classList.remove('selected');
    betType = el.dataset.bet;
    markedNumbers = [];
    numberEls.forEach(e=>e.classList.remove('marked'));
    refreshSelectedLine();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  });
});
refreshSelectedLine();

/* ---------- wheel drawing ---------- */
const WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const svg = document.getElementById('wheel-svg');
const CX=150, CY=150, R=148;
const segAngle = 360 / WHEEL_ORDER.length;
function polar(cx,cy,r,angleDeg){ const rad=(angleDeg-90)*Math.PI/180; return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)}; }
const svgNS = "http://www.w3.org/2000/svg";
function hexFor(n){ const c=colorFor(n); return c==='green' ? '#18b673' : c==='red' ? '#d81e05' : '#0d0d0d'; }
const INNER_R = R*0.42;
WHEEL_ORDER.forEach((num,i)=>{
  const startAngle=i*segAngle, endAngle=startAngle+segAngle;
  const mid=startAngle+segAngle/2;

  const po1=polar(CX,CY,R,startAngle), po2=polar(CX,CY,R,endAngle);
  const pi1=polar(CX,CY,INNER_R,endAngle), pi2=polar(CX,CY,INNER_R,startAngle);
  const largeArc = segAngle>180 ? 1:0;
  const path=document.createElementNS(svgNS,"path");
  path.setAttribute("d",
    `M${po1.x},${po1.y} A${R},${R} 0 ${largeArc} 1 ${po2.x},${po2.y} L${pi1.x},${pi1.y} A${INNER_R},${INNER_R} 0 ${largeArc} 0 ${pi2.x},${pi2.y} Z`);
  path.setAttribute("fill", hexFor(num));
  path.setAttribute("stroke", "#0a0714");
  path.setAttribute("stroke-width", "1.5");
  svg.appendChild(path);

  const dotCount = 3 + (i % 3);
  for (let d=0; d<dotCount; d++){
    const t = 0.15 + (d/(dotCount-1||1))*0.28 + (Math.random()-0.5)*0.04;
    const spread = (Math.random()-0.5)*segAngle*0.5;
    const dotR = INNER_R + t*(R-INNER_R);
    const dpos = polar(CX,CY,dotR,mid+spread);
    const dot=document.createElementNS(svgNS,"circle");
    dot.setAttribute("cx", dpos.x); dot.setAttribute("cy", dpos.y);
    dot.setAttribute("r", 1.6);
    dot.setAttribute("fill", "#f5c542");
    dot.setAttribute("opacity", "0.7");
    svg.appendChild(dot);
  }

  const labelPos=polar(CX,CY,R*0.90,mid);
  const text=document.createElementNS(svgNS,"text");
  text.setAttribute("x", labelPos.x); text.setAttribute("y", labelPos.y);
  text.setAttribute("fill","#ffffff"); text.setAttribute("font-size","14"); text.setAttribute("font-weight","900");
  text.setAttribute("text-anchor","middle"); text.setAttribute("dominant-baseline","middle");
  text.setAttribute("transform", `rotate(${mid}, ${labelPos.x}, ${labelPos.y})`);
  text.textContent = num;
  svg.appendChild(text);
});
const hubRing=document.createElementNS(svgNS,"circle");
hubRing.setAttribute("cx",CX); hubRing.setAttribute("cy",CY); hubRing.setAttribute("r",INNER_R);
hubRing.setAttribute("fill","#0a0714");
svg.insertBefore(hubRing, svg.firstChild);
svg.appendChild((()=>{ const c=document.createElementNS(svgNS,"circle");
  c.setAttribute("cx",CX); c.setAttribute("cy",CY); c.setAttribute("r",INNER_R);
  c.setAttribute("fill","none"); c.setAttribute("stroke","#f5c542"); c.setAttribute("stroke-width","2"); c.setAttribute("opacity","0.5");
  return c; })());

/* ---------- synchronized round clock ---------- */
let currentRotation = 0;
let lastCycleId = null;
let lastPhase = null;

function roundIdNow(){ return Math.floor((Date.now()+timeOffset)/1000 / CYCLE_LENGTH); }
function cyclePosNow(){ return Math.floor((Date.now()+timeOffset)/1000) % CYCLE_LENGTH; }
function isSpinPhase(pos){ return pos >= BET_LENGTH; }
function secondsLeftInBet(pos){ return BET_LENGTH - pos; }
function secondsLeftInSpin(pos){ return CYCLE_LENGTH - pos; }

function lockBoard(){
  numberEls.forEach(el=>el.classList.add('disabled'));
  outsideEls.forEach(el=>el.classList.add('disabled'));
  zeroRow.classList.add('disabled');
}
function unlockBoardForNewRound(){
  markedNumbers = [];
  betType = null;
  ticketPlaced = false;
  ticketId = null;
  numberEls.forEach(el=>{ el.classList.remove('marked'); el.classList.remove('disabled'); });
  outsideEls.forEach(el=>{ el.classList.remove('selected'); el.classList.remove('disabled'); });
  zeroRow.classList.remove('selected');
  zeroRow.classList.remove('disabled');
  document.getElementById('resultLine').textContent = '';
  document.getElementById('resultLine').className = 'result-line';
  document.getElementById('ticketBtn').textContent = '🎫 ትኬት ቁረጥ';
  document.getElementById('ticketBtn').classList.remove('ticketed');
  refreshSelectedLine();
}

async function cutTicket(){
  if (ticketPlaced || spinning) return;
  if (betType === 'number' && markedNumbers.length === 0){
    toast('⚠️ እባክዎ ቢያንስ አንድ ቁጥር ይምረጡ!');
    return;
  }
  if (!betType){
    toast('⚠️ እባክዎ ምርጫ ያድርጉ!');
    return;
  }
  const stake = betType === 'number' ? markedNumbers.length * currentStake : currentStake;
  if (balance < stake){
    toast('❌ በቂ ሂሳብ የለዎትም');
    return;
  }

  try{
    const resp = await fetch('/api/place-ticket', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ initData, round: roundIdNow(), betType, numbers: markedNumbers, stake: currentStake })
    });
    const data = await resp.json();
    if (!resp.ok){
      toast(data.error || '❌ ስህተት ተፈጥሯል');
      return;
    }
    ticketPlaced = true;
    ticketId = data.ticket_id;
    balance = data.balance;
    document.getElementById('walletBalance').textContent = balance;
    lockBoard();
    document.getElementById('ticketBtn').textContent = '✓ ትኬት ተቆርጧል — ዙሩን ይጠብቁ';
    document.getElementById('ticketBtn').classList.add('ticketed');
    document.getElementById('ticketBtn').disabled = true;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  }catch(e){
    toast('❌ ከሰርቨሩ ጋር መገናኘት አልተቻለም');
  }
}

async function resolveRound(roundId){
  spinning = true;
  lockBoard();
  document.getElementById('timerBadge').classList.add('spinning');
  document.getElementById('rtLabel').textContent = 'ዙር...';

  let data;
  try{
    const url = `/api/round-result?round=${roundId}` + (ticketId ? `&ticket_id=${ticketId}` : '') + `&initData=${encodeURIComponent(initData)}`;
    const resp = await fetch(url);
    data = await resp.json();
  }catch(e){
    toast('❌ የዙሩን ውጤት ማምጣት አልተቻለም');
    spinning = false;
    document.getElementById('timerBadge').classList.remove('spinning');
    unlockBoardForNewRound();
    return;
  }

  const winningNumber = data.winning_number;
  const winningIndex = WHEEL_ORDER.indexOf(winningNumber);
  const targetAngle = winningIndex * segAngle + segAngle/2;
  const fullSpins = 8 * 360;
  const finalRotation = fullSpins - targetAngle;
  currentRotation += finalRotation - (currentRotation % 360);

  const wheel = document.getElementById('wheel-container');
  wheel.style.transform = `rotate(${currentRotation}deg)`;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

  setTimeout(()=>{
    spinning = false;
    document.getElementById('timerBadge').classList.remove('spinning');
    document.getElementById('rtLabel').textContent = 'ይምረጡ';
    if (typeof data.balance === 'number'){
      balance = data.balance;
      document.getElementById('walletBalance').textContent = balance;
    }

    const line = document.getElementById('resultLine');
    const colorLabel = data.winning_color === 'red' ? 'ቀይ' : data.winning_color === 'black' ? 'ጥቁር' : 'አረንጓዴ';
    if (ticketId && data.won){
      line.textContent = `🎉 ${winningNumber} (${colorLabel}) ወጣ — ${data.amount} አሸንፈዋል!`;
      line.classList.add('win');
      showWinFlash(data.amount);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else if (ticketId){
      line.textContent = `😔 ${winningNumber} (${colorLabel}) ወጣ — እንደገና ይሞክሩ`;
      line.classList.add('lose');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    } else {
      line.textContent = `${winningNumber} (${colorLabel}) ወጣ`;
    }

    resultHistory.unshift({ number: winningNumber, color: data.winning_color });
    if (resultHistory.length > HISTORY_MAX) resultHistory.length = HISTORY_MAX;
    renderHistory();

    setTimeout(unlockBoardForNewRound, RESULT_DISPLAY_MS);
  }, SPIN_LENGTH * 1000);
}

function renderHistory(){
  const strip = document.getElementById('historyStrip');
  if (!resultHistory.length){
    strip.innerHTML = '';
    return;
  }
  strip.innerHTML = '';
  resultHistory.forEach(r=>{
    const chip = document.createElement('div');
    chip.className = 'hist-chip ' + r.color;
    chip.textContent = r.number;
    strip.appendChild(chip);
  });
}

function tickRoundClock(){
  updatePlayerCount();

  const cid = roundIdNow();
  const pos = cyclePosNow();
  const phase = isSpinPhase(pos) ? 'spin' : 'bet';

  if (lastCycleId === null){ lastCycleId = cid; lastPhase = phase; }

  if (phase === 'spin' && lastPhase === 'bet'){
    resolveRound(cid);
  }
  // new betting round started -> restart the 2-5 winner blink burst
  if (phase === 'bet' && cid !== lastCycleId){
    startWinnerBurstForRound();
  }
  lastPhase = phase;
  lastCycleId = cid;

  if (phase === 'bet'){
    const left = secondsLeftInBet(pos);
    document.getElementById('rtLabel').textContent = 'ይምረጡ';
    document.getElementById('rtCount').textContent = left;
  } else {
    const left = secondsLeftInSpin(pos);
    document.getElementById('rtCount').textContent = left;
  }
}
tickRoundClock();
setInterval(tickRoundClock, 1000);
</script>
