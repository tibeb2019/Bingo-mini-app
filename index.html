<!DOCTYPE html>
<html lang="am"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spin Win</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ice:#e0f2fe}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#0ea5e9 0%,#1d4ed8 45%,#071a3d 100%) fixed}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;background:rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.35)}
.brand{font-size:22px;font-weight:900;letter-spacing:.5px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.bal{flex:1;text-align:center;font-weight:800;color:#fff}
.bal small{display:block;font-size:11px;color:var(--ice);font-weight:400}
.dep{background:linear-gradient(180deg,#4ade80,#16a34a);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
h2{text-align:center;margin:20px 0 6px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.cards{display:grid;gap:18px;padding:14px}
.card{display:block;text-decoration:none;color:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.7)}
.card:active{transform:scale(.98)}
.card svg{display:block;width:100%;height:auto}
.info{padding:14px 16px 16px}
.spin .info{background:linear-gradient(180deg,#ffffff,#dbeafe);color:#0b3b8c}
.avi .info{background:linear-gradient(180deg,#0b3b8c,#071a3d);color:#fff}
.nm{font-size:26px;font-weight:900}
.ds{font-size:14px;margin-top:2px;opacity:.85}
.go{display:inline-block;margin-top:10px;border-radius:12px;padding:9px 26px;font-weight:900}
.spin .go{background:linear-gradient(180deg,#38bdf8,#0369a1);color:#fff}
.avi .go{background:linear-gradient(180deg,#ffffff,#bae6fd);color:#0b3b8c}
</style></head><body>
<div class="top">
<div class="brand">Spin Win</div>
<div class="bal"><small>ቀሪ ሂሳብ</small><span id="bal">...</span> ETB</div>
<button class="dep" id="dep">+ Deposit</button>
</div>
<h2>ጨዋታ ምረጥ</h2>
<div class="cards">

<a class="card spin" data-p="/spin.html" href="/spin.html">
<svg viewBox="0 0 400 190" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d4a2c"/><stop offset="1" stop-color="#0a2a1a"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3a1"/><stop offset="1" stop-color="#b8892a"/></linearGradient>
<radialGradient id="hub" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#4f6bff"/><stop offset="1" stop-color="#1b2a9a"/></radialGradient>
</defs>
<rect width="400" height="190" fill="url(#g1)"/>
<g transform="translate(200 100)">
<circle r="88" fill="url(#gold)"/>
<circle r="80" fill="#111"/>
<g id="wheel"></g>
<circle r="36" fill="#0a0a0a"/>
<circle r="31" fill="url(#gold)"/>
<circle r="27" fill="url(#hub)"/>
<text y="-2" text-anchor="middle" fill="#fff" font-size="9" font-weight="900" font-family="Segoe UI,sans-serif">SPIN</text>
<text y="9" text-anchor="middle" fill="#fff" font-size="9" font-weight="900" font-family="Segoe UI,sans-serif">WIN</text>
</g>
<polygon points="200,8 192,-4 208,-4" transform="translate(0 6)" fill="#f6c343" stroke="#fff" stroke-width="1.5"/>
</svg>
<div class="info"><div class="nm">Spin Win</div><div class="ds">ሩሌት - ቁጥር ምረጥ እና አሸንፍ</div><span class="go">ተጫወት</span></div>
</a>

<a class="card avi" data-p="/aviator.html" href="/aviator.html">
<svg viewBox="0 0 400 190" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#450a0a"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".9"/></linearGradient>
</defs>
<rect width="400" height="190" fill="url(#g2)"/>
<circle cx="60" cy="40" r="26" fill="#fff" opacity=".15"/>
<ellipse cx="90" cy="150" rx="50" ry="14" fill="#fff" opacity=".2"/>
<ellipse cx="330" cy="40" rx="40" ry="11" fill="#fff" opacity=".2"/>
<path d="M0 185 C110 180 230 150 330 70" stroke="url(#g3)" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M0 190 C110 185 230 155 330 75 L330 190Z" fill="#fff" opacity=".12"/>
<g transform="translate(330 66) rotate(-32)">
<ellipse cx="0" cy="0" rx="46" ry="11" fill="#fff"/>
<path d="M-34 -2 L-52 -22 L-42 -22 L-22 -4Z" fill="#fee2e2"/>
<path d="M-6 -2 L-26 -34 L-12 -34 L16 -2Z" fill="#fecaca" stroke="#fff" stroke-width="1"/>
<path d="M-6 4 L-26 34 L-12 34 L16 4Z" fill="#fca5a5" stroke="#fff" stroke-width="1"/>
<ellipse cx="28" cy="-3" rx="9" ry="4" fill="#7f1d1d"/>
<path d="M40 -4 Q50 0 40 5" fill="#dc2626"/>
</g>
<text x="20" y="46" fill="#fff" font-size="32" font-weight="900" font-family="Georgia,serif">2.45x</text>
</svg>
<div class="info"><div class="nm">Aviator</div><div class="ds">አውሮፕላኑ ሳይበር በፊት Cash out!</div><span class="go">ተጫወት</span></div>
</a>

</div>
<script>
(function(){
var order=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
var red={1:1,3:1,5:1,7:1,9:1,12:1,14:1,16:1,18:1,19:1,21:1,23:1,25:1,27:1,30:1,32:1,34:1,36:1};
var n=order.length,a=2*Math.PI/n,R=76,s='';
for(var i=0;i<n;i++){
var a0=i*a-a/2-Math.PI/2,a1=a0+a,am=(a0+a1)/2,v=order[i];
var col=v===0?'#16a34a':(red[v]?'#dc2626':'#111111');
s+='<path d="M0 0L'+(R*Math.cos(a0)).toFixed(2)+' '+(R*Math.sin(a0)).toFixed(2)+'A'+R+' '+R+' 0 0 1 '+(R*Math.cos(a1)).toFixed(2)+' '+(R*Math.sin(a1)).toFixed(2)+'Z" fill="'+col+'" stroke="#e8c15c" stroke-width=".4"/>';
var tx=(61*Math.cos(am)).toFixed(2),ty=(61*Math.sin(am)).toFixed(2),deg=(am*180/Math.PI+90).toFixed(1);
s+='<text x="'+tx+'" y="'+ty+'" transform="rotate('+deg+' '+tx+' '+ty+')" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="7.5" font-weight="800" font-family="Segoe UI,sans-serif">'+v+'</text>';
}
document.getElementById('wheel').innerHTML=s;
})();
var tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();}catch(e){}}
document.querySelectorAll('.card').forEach(function(a){
a.href=a.getAttribute('data-p')+location.hash;});
document.getElementById('dep').onclick=function(){
var u='https://t.me/BingotomBot?start=deposit';
try{if(tg&&tg.openTelegramLink){tg.openTelegramLink(u);}else{window.open(u,'_blank');}}catch(e){}
setTimeout(function(){try{if(tg)tg.close();}catch(e){}},400);
};
async function loadBal(n){
var initData=tg?tg.initData:'';
try{
var r=await fetch('/api/balance?initData='+encodeURIComponent(initData));
var d=await r.json();
var b=(d.balance!==undefined)?d.balance:(d.data&&d.data.balance);
if(b===undefined)throw 0;
document.getElementById('bal').textContent=Number(b).toFixed(2);
}catch(e){
if(n<8)setTimeout(function(){loadBal(n+1)},4000);
else document.getElementById('bal').textContent='--';}}
loadBal(0);
</script>
</body></html>
