<!DOCTYPE html>
<html lang="am"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bingotom</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#e8c15c;--gold-dim:#8a6d1f;--black:#141414;--black2:#0a0a0a;--green:#1e8a54;--text:#f4ede0;--text-dim:#b7ab8f;--felt:#0d4a2c;--felt2:#0a3a22}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at top,var(--felt) 0,var(--felt2) 45%,var(--black2) 100%);color:var(--text)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;background:var(--black2);border-bottom:2px solid var(--gold-dim)}
.brand{font-size:20px;font-weight:800;letter-spacing:.6px;color:var(--gold);font-family:Georgia,'Times New Roman',serif}
.bal{flex:1;text-align:center;font-weight:700;color:var(--gold)}
.bal small{display:block;font-size:11px;color:var(--text-dim);font-weight:400}
.dep{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
h2{text-align:center;margin:22px 0 8px;color:var(--gold);font-family:Georgia,serif}
.cards{display:grid;gap:16px;padding:14px}
.card{display:block;text-decoration:none;color:var(--text);border:2px solid var(--gold-dim);border-radius:18px;padding:18px;background:linear-gradient(160deg,#1b1b1b,#0a0a0a);box-shadow:0 4px 16px rgba(0,0,0,.5)}
.card:active{transform:scale(.98)}
.card .ic{font-size:44px}
.card .nm{font-size:24px;font-weight:800;color:var(--gold);font-family:Georgia,serif;margin-top:6px}
.card .ds{color:var(--text-dim);font-size:14px;margin-top:4px}
.card .go{display:inline-block;margin-top:12px;background:var(--gold);color:#141414;font-weight:800;border-radius:10px;padding:8px 20px}
</style></head><body>
<div class="top">
<div class="brand">Bingotom</div>
<div class="bal"><small>ቀሪ ሂሳብ</small><span id="bal">...</span> ETB</div>
<button class="dep" id="dep">+ Deposit</button>
</div>
<h2>ጨዋታ ምረጥ</h2>
<div class="cards">
<a class="card" data-p="/spin.html" href="/spin.html">
<div class="ic">🎡</div><div class="nm">Spin Win</div>
<div class="ds">ሩሌት - ቁጥር ምረጥ እና አሸንፍ</div><span class="go">ተጫወት</span></a>
<a class="card" data-p="/aviator.html" href="/aviator.html">
<div class="ic">✈️</div><div class="nm">Aviator</div>
<div class="ds">አውሮፕላኑ ሳይበር በፊት Cash out!</div><span class="go">ተጫወት</span></a>
</div>
<script>
var tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();}catch(e){}}
document.querySelectorAll('.card').forEach(function(a){
a.href=a.getAttribute('data-p')+location.hash;});
document.getElementById('dep').onclick=function(){
var u='https://t.me/BingotomBot';
if(tg&&tg.openTelegramLink){tg.openTelegramLink(u);}else{location.href=u;}};
async function loadBal(n){
var initData=tg?tg.initData:'';
try{
var r=await fetch('/api/balance?initData='+encodeURIComponent(initData));
var d=await r.json();
var b=(d.balance!==undefined)?d.balance:(d.data&&d.data.balance);
if(b===undefined)throw 0;
document.getElementById('bal').textContent=Number(b).toFixed(2);
}catch(e){
if(n<8)setTimeout(function(){loadBal(n+1)},4000);
else document.getElementById('bal').textContent='--';}}
loadBal(0);
</script>
</body></html>
