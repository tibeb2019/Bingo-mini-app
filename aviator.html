<!DOCTYPE html>
<html lang="am"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aviator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e0e12;color:#fff;font-family:system-ui,sans-serif;user-select:none;padding-bottom:20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#1b1c1d}
.back{background:#2c2d30;border:0;color:#fff;border-radius:8px;padding:6px 12px;font-size:16px}
.snd{background:#2c2d30;border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:15px}
.logo{color:#e50539;font-style:italic;font-weight:900;font-size:24px}
.bal{font-weight:700;color:#28a909;font-size:14px}
.hist{display:flex;gap:6px;overflow:hidden;padding:8px 10px;background:#101012;min-height:36px}
.hist span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;background:#1b1c1d;white-space:nowrap}
.c1{color:#34b4ff}.c2{color:#913ef8}.c3{color:#c017b4}
.game{position:relative;margin:8px;border:1px solid #2a2a2e;border-radius:12px;overflow:hidden;background:#000;height:230px}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.big{font-size:52px;font-weight:900}
.msg{font-size:14px;font-weight:700;letter-spacing:1px}
.bar{width:60%;height:5px;background:#222;border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#e50539;width:100%}
.pl{position:absolute;top:6px;left:8px;font-size:12px;color:#aaa}
.panel{margin:8px;padding:8px;background:#1b1c1d;border:1px solid #2a2a2e;border-radius:12px}
.tabs{display:flex;background:#101012;border-radius:16px;margin:0 auto 8px;width:150px}
.tabs b{flex:1;text-align:center;padding:5px;font-size:13px;border-radius:16px;color:#888}
.tabs b.on{background:#2c2d30;color:#fff}
.row{display:flex;gap:8px;align-items:stretch}
.l{flex:1}
.step{display:flex;align-items:center;justify-content:space-between;background:#000;border-radius:18px;padding:3px 6px}
.step button{width:26px;height:26px;border-radius:50%;border:1px solid #666;background:none;color:#fff;font-size:16px}
.step span{font-weight:700}
.q{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.q button{background:#2c2d30;border:0;color:#bbb;border-radius:6px;padding:5px;font-size:13px}
.go{width:42%;border:2px solid #5fd33a;border-radius:12px;font-weight:800;font-size:15px;color:#fff;background:#28a909}
.go.cash{background:#d07206;border-color:#ffa53a}
.go.wait{background:#555;border-color:#777;font-size:13px}
.auto{display:none;margin-top:6px;font-size:13px;color:#aaa}
.auto input{width:70px;background:#000;border:1px solid #444;color:#fff;border-radius:6px;padding:4px;margin-left:6px}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#333;padding:8px 14px;border-radius:8px;font-size:14px;display:none;z-index:9;max-width:90%;text-align:center}
</style>
</head><body>
